name: test
on: [push, pull_request]
jobs:
  test:
    uses: nimbase/setup-nim-action/.github/workflows/test_clue.yml@main
    with:
      nim-version: stable
      os: '[{"os":"ubuntu-latest"},{"os":"macos-latest"}]'
      # Shard wrappers import the host's lang/transformers (and libllm
      # needs lang/parser), so the dfkup checkout must exist at build
      # time. Only `--path`s are used; dfkup is never a package dep.
      pre-install-command: |
        git clone --depth 1 https://github.com/dfkup/dfkup.git /tmp/dfkup
      # Build every shard (compile-verifies all 30 modules, including
      # libllm) before `clue test` runs the package's own test suite.
      pre-test-command: |
        PYBIN="$(command -v python3 || command -v python)"
        "$PYBIN" tools/build_shards.py --dfkup-src /tmp/dfkup --out dist/shards
