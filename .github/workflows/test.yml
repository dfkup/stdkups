name: test
on: [push, pull_request]
jobs:
  test:
    uses: nimbase/setup-nim-action/.github/workflows/test_clue.yml@main
    with:
      nim-version: stable
      os: '[{"os":"ubuntu-latest"},{"os":"macos-latest"}]'
      # The dfkup sources come from the published package, not a
      # checkout: `clue install dfkup --build` installs and builds it,
      # and the shard builder resolves its path through clue
      # (develop checkout wins locally, registry install in CI).
      pre-install-command: |
        clue install dfkup --build
      # Build every shard (compile-verifies all 30 modules, including
      # libllm) before `clue test` runs the package's own test suite.
      pre-test-command: |
        clue build tools/build_shards.nim -o /tmp/build_shards &&
        /tmp/build_shards --out=dist/shards
